services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5432" # Expose PostgreSQL on host port 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web_net

  strapi:
    image: strapi:develop
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: postgres
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - web_net
    depends_on:
      - postgres
    ports:
      - "1337:1337"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_net"
      - "traefik.http.routers.strapi.rule=Host(strapi.turbeen.ir)"
      - "traefik.http.routers.strapi.entrypoints=http"
      - "traefik.http.routers.strapi.middlewares=https-redirect"
      - "traefik.http.routers.strapi-secure.entrypoints=https"
      - "traefik.http.routers.strapi-secure.rule=Host(strapi.turbeen.ir)"
      - "traefik.http.routers.strapi-secure.tls=true"
      - "traefik.http.routers.strapi-secure.tls.certresolver=mycert"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"
    volumes:
      - strapi_uploads:/app/apps/strapi/public/uploads

volumes:
  postgres_data:
  strapi_uploads:

networks:
  web_net:
    external: true
